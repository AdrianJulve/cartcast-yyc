name: Refresh data and deploy dashboard

# Keeps the public dashboard on GitHub Pages up to date.
#
# - Every Monday it downloads the latest real data, commits data/snapshot/ if
#   anything changed, and redeploys. StatCan releases monthly, so most weeks
#   nothing changes; checking weekly means a new release appears within days.
# - Every push to main redeploys. If no snapshot has been committed yet, the
#   push run downloads the real data first.
# - It can also be run by hand from the Actions tab.
on:
  push:
    branches: [main]
  schedule:
    - cron: "41 15 * * 1" # 15:41 UTC every Monday
  workflow_dispatch:
    inputs:
      skip_fetch:
        description: "Build from the snapshot already in the repo instead of downloading"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e .

      - name: Decide whether to download new data
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ -f data/snapshot/manifest.json ]; then
            echo "fetch=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ inputs.skip_fetch }}" = "true" ]; then
            echo "fetch=false" >> "$GITHUB_OUTPUT"
          else
            echo "fetch=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download real data and update the snapshot
        if: steps.mode.outputs.fetch == 'true'
        run: python -m cartcast fetch

      - name: Check basket product names
        run: python -m cartcast validate

      - name: Build dashboard
        run: python -m cartcast build

      - name: Commit the updated snapshot
        if: steps.mode.outputs.fetch == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshot
          if git diff --cached --quiet; then
            echo "Snapshot unchanged."
          else
            git commit -m "data: refresh snapshot $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Add processed data to the site
        run: |
          mkdir -p site/data
          cp data/processed/*.json site/data/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
