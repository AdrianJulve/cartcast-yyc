name: Refresh data & deploy dashboard

# StatCan publishes average retail prices roughly monthly (about 5–6 weeks after
# the reference month) and the CPI mid-month. Running on the 22nd picks up both.
on:
  schedule:
    - cron: "41 15 22 * *" # 15:41 UTC on the 22nd of every month
  workflow_dispatch:
    inputs:
      use_sample:
        description: "Deploy the offline SAMPLE build instead of live data"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e .

      - name: Fetch live data
        if: ${{ !inputs.use_sample }}
        run: python -m cartcast fetch

      - name: Validate basket product names
        if: ${{ !inputs.use_sample }}
        run: python -m cartcast validate

      - name: Build dashboard (live)
        if: ${{ !inputs.use_sample }}
        run: python -m cartcast build

      - name: Build dashboard (sample)
        if: ${{ inputs.use_sample }}
        run: python -m cartcast build --sample

      - name: Add processed data to the site
        run: |
          mkdir -p site/data
          cp data/processed/*.json site/data/

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
