name: Refresh data and deploy dashboard

# StatCan publishes average retail prices about five to six weeks after the
# reference month, and the CPI in the middle of the month. Running on the 22nd
# picks up both. The job downloads the real data, commits the updated
# data/snapshot/ folder to main, and deploys the dashboard to GitHub Pages.
on:
  schedule:
    - cron: "41 15 22 * *" # 15:41 UTC on the 22nd of every month
  workflow_dispatch:
    inputs:
      skip_fetch:
        description: "Build from the snapshot already in the repo instead of downloading"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e .

      - name: Download real data and update the snapshot
        if: ${{ !inputs.skip_fetch }}
        run: python -m cartcast fetch

      - name: Check basket product names
        run: python -m cartcast validate

      - name: Build dashboard
        run: python -m cartcast build

      - name: Commit the updated snapshot
        if: ${{ !inputs.skip_fetch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshot
          if git diff --cached --quiet; then
            echo "Snapshot unchanged."
          else
            git commit -m "data: refresh snapshot $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Add processed data to the site
        run: |
          mkdir -p site/data
          cp data/processed/*.json site/data/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
