name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Lint and test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: python -m pytest
      - name: Validate basket against sample data
        run: python -m cartcast validate --sample
      - name: Build sample dashboard
        run: python -m cartcast build --sample
      - name: Build from the real-data snapshot
        if: hashFiles('data/snapshot/manifest.json') != ''
        run: |
          python -m cartcast validate
          python -m cartcast build --out site-real
      - name: Upload dashboard preview
        if: matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-preview
          path: site/
          retention-days: 14
